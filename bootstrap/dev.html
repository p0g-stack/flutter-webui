<!DOCTYPE html>
<!-- flutter-webui dev entry: the page stays on the manager's origin (so the
     ksu bridge and insets keep working) while the app comes from a dev server
     on 127.0.0.1, given as ?dev=http://127.0.0.1:<port>/ or in the
     webui-dev-server meta tag. The dev server must allow the manager's origin
     (CORS), and a WebUI X dev module's config.json CSP must allow it.
     SPDX-License-Identifier: LGPL-3.0-or-later WITH LGPL-3.0-linking-exception -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="webui-module-id" content="">
  <meta name="webui-dev-server" content="">
  <title>Flutter (dev)</title>
  <script>
    (function () {
      var meta = document.querySelector('meta[name="webui-dev-server"]');
      var dev = new URLSearchParams(location.search).get('dev') || (meta && meta.content);
      if (!dev) { document.write('No dev server: open dev.html?dev=http://127.0.0.1:PORT/'); return; }
      if (dev.charAt(dev.length - 1) !== '/') dev += '/';
      // Absolute: the <base> below would send /internal/... to the dev server.
      var insets = document.createElement('link');
      insets.id = 'flutter-webui-insets';
      insets.rel = 'stylesheet';
      insets.href = location.origin + '/internal/insets.css';
      document.head.appendChild(insets);
      var base = document.createElement('base');
      base.href = dev;
      document.head.appendChild(base);
      window.flutterWebUiDevServer = dev;
    })();
  </script>
  <link rel="stylesheet" href="flutter_webui.css">
</head>
<body>
  <div id="flutter-webui-splash" aria-hidden="true"></div>
  <script>
    (function () {
      if (!window.flutterWebUiDevServer) return;
      var glue = document.createElement('script');
      glue.src = window.flutterWebUiDevServer + 'flutter_webui.js';
      glue.onload = function () {
        var boot = document.createElement('script');
        boot.src = window.flutterWebUiDevServer + 'flutter_bootstrap.js';
        document.body.appendChild(boot);
      };
      document.body.appendChild(glue);
    })();
  </script>
</body>
</html>
